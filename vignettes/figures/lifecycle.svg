<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#374151"/></marker></defs>
<rect width="760" height="440" fill="#ffffff"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#111827">The life of the p field</text>
<rect x="20" y="60" width="180" height="90" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
<text x="110" y="88" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Compact</text>
<text x="110" y="110" font-size="12" fill="#111827" text-anchor="middle">run table only</text>
<text x="110" y="130" font-size="12" fill="#111827" text-anchor="middle">precision(), kernels, [ </text>
<rect x="290" y="60" width="180" height="90" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="380" y="88" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Expanded by vctrs</text>
<text x="380" y="110" font-size="12" fill="#111827" text-anchor="middle">n integers, to slice</text>
<text x="380" y="130" font-size="12" fill="#111827" text-anchor="middle">a new object, x unchanged</text>
<rect x="560" y="60" width="180" height="90" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
<text x="650" y="88" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Compact again</text>
<text x="650" y="110" font-size="12" fill="#111827" text-anchor="middle">runs found by one scan</text>
<text x="650" y="130" font-size="12" fill="#111827" text-anchor="middle">new, smaller vector</text>
<g stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah)">
<line x1="202" y1="105" x2="286" y2="105"/><line x1="472" y1="105" x2="556" y2="105"/>
</g>
<text x="244" y="95" font-size="11" fill="#374151" text-anchor="middle">vec_proxy()</text>
<text x="514" y="95" font-size="11" fill="#374151" text-anchor="middle">vec_restore()</text>
<text x="380" y="176" font-size="12" fill="#374151" text-anchor="middle">Slicing or combining with vctrs: expand, slice, recompress. The original is untouched.</text>
<line x1="30" y1="198" x2="730" y2="198" stroke="#d1d5db" stroke-width="1"/>
<text x="20" y="226" font-size="13" font-weight="bold" fill="#111827">Writing through a data pointer (for example p[1] &lt;- 5L in base R)</text>
<rect x="20" y="250" width="180" height="90" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
<text x="110" y="278" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Compact</text>
<text x="110" y="300" font-size="12" fill="#111827" text-anchor="middle">run table is valid</text>
<rect x="290" y="250" width="180" height="90" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="380" y="278" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Stale</text>
<text x="380" y="300" font-size="12" fill="#111827" text-anchor="middle">the expanded integers</text>
<text x="380" y="318" font-size="12" fill="#111827" text-anchor="middle">are the only truth</text>
<rect x="560" y="250" width="180" height="90" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
<text x="650" y="278" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Run table discarded</text>
<text x="650" y="300" font-size="12" fill="#111827" text-anchor="middle">now an ordinary integer;</text>
<text x="650" y="318" font-size="12" fill="#111827" text-anchor="middle">results recompressed</text>
<g stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah)">
<line x1="202" y1="295" x2="286" y2="295"/><line x1="472" y1="295" x2="556" y2="295"/>
</g>
<text x="244" y="285" font-size="11" fill="#374151" text-anchor="middle">writable</text>
<text x="514" y="285" font-size="11" fill="#374151" text-anchor="middle">cannot trust</text>
<text x="380" y="372" font-size="12" fill="#374151" text-anchor="middle">Reading through a pointer (such as format()) keeps the run table valid.</text>
<text x="380" y="394" font-size="12" fill="#374151" text-anchor="middle">prec_digits() and vec_proxy() hand out fresh objects, so x itself never goes stale.</text>
</svg>
