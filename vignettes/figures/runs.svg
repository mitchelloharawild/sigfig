<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#374151"/></marker></defs>
<rect width="760" height="420" fill="#ffffff"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#111827">p looks like an ordinary integer vector, but is stored as runs</text>
<text x="20" y="62" font-size="13" font-weight="bold" fill="#b45309">What R sees: 10 integers</text>
<g stroke="#b45309" stroke-width="1.5">
<rect x="60" y="100" width="64" height="38" fill="#fef3c7"/><rect x="124" y="100" width="64" height="38" fill="#fef3c7"/>
<rect x="188" y="100" width="64" height="38" fill="#fef3c7"/><rect x="252" y="100" width="64" height="38" fill="#fef3c7"/>
<rect x="316" y="100" width="64" height="38" fill="#fef3c7"/>
<rect x="380" y="100" width="64" height="38" fill="#fde68a"/><rect x="444" y="100" width="64" height="38" fill="#fde68a"/>
<rect x="508" y="100" width="64" height="38" fill="#fef3c7"/><rect x="572" y="100" width="64" height="38" fill="#fef3c7"/>
<rect x="636" y="100" width="64" height="38" fill="#fef3c7"/>
</g>
<g font-size="12" fill="#6b7280" text-anchor="middle">
<text x="92" y="92">1</text><text x="156" y="92">2</text><text x="220" y="92">3</text><text x="284" y="92">4</text><text x="348" y="92">5</text>
<text x="412" y="92">6</text><text x="476" y="92">7</text><text x="540" y="92">8</text><text x="604" y="92">9</text><text x="668" y="92">10</text>
</g>
<g font-size="16" fill="#111827" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">
<text x="92" y="125">1</text><text x="156" y="125">1</text><text x="220" y="125">1</text><text x="284" y="125">1</text><text x="348" y="125">1</text>
<text x="412" y="125">2</text><text x="476" y="125">2</text><text x="540" y="125">0</text><text x="604" y="125">0</text><text x="668" y="125">0</text>
</g>
<text x="20" y="116" font-size="12" fill="#6b7280">i</text>
<g stroke="#374151" stroke-width="1.5" fill="none">
<path d="M60,142 v8 h320 v-8"/><path d="M380,142 v8 h128 v-8"/><path d="M508,142 v8 h192 v-8"/>
</g>
<g font-size="12" fill="#374151" text-anchor="middle">
<text x="220" y="166">run 1</text><text x="444" y="166">run 2</text><text x="604" y="166">run 3</text>
</g>
<text x="20" y="206" font-size="13" font-weight="bold" fill="#b45309">What is stored: 3 runs</text>
<text x="60" y="240" font-size="13" fill="#111827" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">values</text>
<text x="60" y="280" font-size="13" fill="#111827" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">ends</text>
<g stroke="#b45309" stroke-width="1.5" fill="#fef3c7">
<rect x="150" y="220" width="64" height="30"/><rect x="214" y="220" width="64" height="30"/><rect x="278" y="220" width="64" height="30"/>
<rect x="150" y="260" width="64" height="30"/><rect x="214" y="260" width="64" height="30"/><rect x="278" y="260" width="64" height="30"/>
</g>
<g font-size="15" fill="#111827" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">
<text x="182" y="241">1</text><text x="246" y="241">2</text><text x="310" y="241">0</text>
<text x="182" y="281">5</text><text x="246" y="281">7</text><text x="310" y="281">10</text>
</g>
<text x="150" y="310" font-size="12" fill="#374151">ends are cumulative counts</text>
<rect x="400" y="206" width="330" height="190" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="415" y="230" font-size="13" font-weight="bold" fill="#111827">Looking up p[6]</text>
<g font-size="12.5" fill="#111827">
<text x="415" y="256">Binary search for the first run whose end</text>
<text x="415" y="274">is at least 6.</text>
<text x="415" y="300" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">ends = 5, 7, 10</text>
<text x="415" y="322">5 &lt; 6, so not run 1.</text>
<text x="415" y="340">7 &gt;= 6, so run 2.</text>
<text x="415" y="362" font-weight="bold">values[2] = 2, so p[6] = 2</text>
<text x="415" y="382" fill="#374151">Cost is O(log k) for k runs.</text>
</g>
<text x="20" y="360" font-size="12" fill="#374151">Sequential reads and the kernels walk the runs,</text>
<text x="20" y="378" font-size="12" fill="#374151">so they never need a search or the 10 integers.</text>
<text x="20" y="398" font-size="12" fill="#374151">Adjacent runs always differ.</text>
<path d="M412,142 C412,190 330,190 250,218" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
</svg>
