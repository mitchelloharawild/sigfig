<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#374151"/></marker></defs>
<rect width="760" height="330" fill="#ffffff"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#111827">A precision vector is a record of two fields of equal size</text>
<text x="170" y="68" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">x</text>
<text x="170" y="86" font-size="12" fill="#374151" text-anchor="middle">double: the full value</text>
<text x="350" y="68" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">p</text>
<text x="350" y="86" font-size="12" fill="#374151" text-anchor="middle">integer: decimal places known</text>
<text x="600" y="68" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">printed</text>
<text x="600" y="86" font-size="12" fill="#374151" text-anchor="middle">rounded to p</text>
<text x="40" y="131" font-size="12" fill="#6b7280" text-anchor="middle">[1]</text>
<text x="40" y="171" font-size="12" fill="#6b7280" text-anchor="middle">[2]</text>
<text x="40" y="211" font-size="12" fill="#6b7280" text-anchor="middle">[3]</text>
<text x="40" y="251" font-size="12" fill="#6b7280" text-anchor="middle">[4]</text>
<g stroke-width="1.5">
