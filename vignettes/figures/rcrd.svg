<text x="380" y="294" font-size="12" fill="#374151" text-anchor="middle">p = 1 is tenths, p = 0 is whole numbers, and p = -2 is hundreds.</text>
<text x="380" y="314" font-size="12" fill="#374151" text-anchor="middle">Row 3 is 3.2 + 4.12: the full 7.32 is kept, but it is only known to tenths.</text>
