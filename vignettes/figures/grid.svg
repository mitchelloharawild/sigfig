<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#374151"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#d1d5db" stroke-width="2"/></pattern></defs>
<rect width="760" height="420" fill="#ffffff"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#111827">The coarsest precision on a place-value grid</text>
<g font-size="12" fill="#374151" text-anchor="middle">
<text x="270" y="62">tens</text><text x="270" y="78" font-weight="bold">p = -1</text>
<text x="350" y="62">ones</text><text x="350" y="78" font-weight="bold">p = 0</text>
<text x="450" y="62">tenths</text><text x="450" y="78" font-weight="bold">p = 1</text>
<text x="530" y="62">hundredths</text><text x="530" y="78" font-weight="bold">p = 2</text>
<text x="610" y="62">thousandths</text><text x="610" y="78" font-weight="bold">p = 3</text>
</g>
<g stroke="#9ca3af" stroke-width="1.2">
<rect x="230" y="92" width="80" height="44" fill="#ffffff"/><rect x="310" y="92" width="80" height="44" fill="#ffffff"/>
<rect x="410" y="92" width="80" height="44" fill="#ffffff"/><rect x="490" y="92" width="80" height="44" fill="#ffffff"/><rect x="570" y="92" width="80" height="44" fill="#ffffff"/>
<rect x="230" y="142" width="80" height="44" fill="#ffffff"/><rect x="310" y="142" width="80" height="44" fill="#ffffff"/>
<rect x="410" y="142" width="80" height="44" fill="#ffffff"/><rect x="490" y="142" width="80" height="44" fill="#ffffff"/><rect x="570" y="142" width="80" height="44" fill="#ffffff"/>
<rect x="230" y="200" width="80" height="44" fill="#ffffff"/><rect x="310" y="200" width="80" height="44" fill="#ffffff"/>
<rect x="410" y="200" width="80" height="44" fill="#ffffff"/><rect x="490" y="200" width="80" height="44" fill="#ffffff"/><rect x="570" y="200" width="80" height="44" fill="#ffffff"/>
</g>
<rect x="490" y="92" width="160" height="44" fill="url(#hatch)" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="570" y="142" width="80" height="44" fill="url(#hatch)" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="230" y="258" width="80" height="44" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><rect x="310" y="258" width="80" height="44" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
<rect x="410" y="258" width="80" height="44" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/><rect x="490" y="258" width="160" height="44" fill="url(#hatch)" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="490" y="200" width="80" height="44" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<g font-size="22" fill="#111827" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">
<text x="350" y="123">3</text><text x="450" y="123">2</text>
<text x="350" y="173">4</text><text x="450" y="173">1</text><text x="530" y="173">2</text>
<text x="350" y="231">7</text><text x="450" y="231">3</text><text x="530" y="231" fill="#1d4ed8">2</text>
<text x="350" y="289">7</text><text x="450" y="289">3</text>
</g>
<g font-size="22" fill="#111827" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">
<text x="400" y="123">.</text><text x="400" y="173">.</text><text x="400" y="231">.</text><text x="400" y="289">.</text>
</g>
<g font-size="13" fill="#111827" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">
<text x="20" y="119">3.2</text><text x="20" y="169">4.12</text><text x="20" y="227">7.32</text><text x="20" y="285">7.3</text>
</g>
<g font-size="12" fill="#374151">
<text x="20" y="134">p = 1, to tenths</text><text x="20" y="184">p = 2, to hundredths</text>
<text x="20" y="243">x kept in full</text><text x="20" y="301">printed at p = 1</text>
</g>
<text x="670" y="119" font-size="12" fill="#374151">unknown</text>
<text x="670" y="169" font-size="12" fill="#374151">unknown</text>
<text x="670" y="285" font-size="12" fill="#374151">unknown</text>
<line x1="490" y1="86" x2="490" y2="316" stroke="#b45309" stroke-width="2.5"/>
<text x="490" y="338" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">coarsest known: p = min(1, 2) = 1</text>
<text x="380" y="372" font-size="12" fill="#374151" text-anchor="middle">Digits right of the line are unknown in at least one input, so they are not shown.</text>
<text x="380" y="392" font-size="12" fill="#374151" text-anchor="middle">The 2 in 7.32 is still stored in x, so later sums are not rounded by earlier ones.</text>
</svg>
